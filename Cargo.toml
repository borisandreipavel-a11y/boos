[package]
name = "boos"
version = "0.1.0"
edition = "2024"

[dependencies]
# The network stack: the only code in this kernel that was not written for it.
# Its default features are switched off because they need an operating system
# underneath. The ones switched on: it may use the kernel's heap, it speaks to
# an Ethernet card, it speaks the internet's protocol, it can ask the network
# for an address, look up names, and hold connections. See docs/network.md.
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-dhcpv4", "socket-dns", "socket-tcp"] }

# Encryption: the library that speaks TLS, the list of trusted roots, and the
# crates that do the arithmetic. None of this code was written for this
# kernel either. Default features are off because they need an operating
# system underneath. See docs/encryption.md.
rustls = { version = "0.23.46", default-features = false }
webpki-roots = "1.0.12"
sha2 = { version = "0.11.1", default-features = false }
hmac = { version = "0.13.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rsa = { version = "0.10.0", default-features = false, features = ["pkcs1v15"] }
# Certificates write pairs of numbers in a fixed form; this crate reads it.
# The crates above use it already.
der = { version = "0.8.3", default-features = false }

# The locked box: the library that runs an app's WebAssembly, one small step
# at a time. Not written for this kernel either. Default features are off
# because they need an operating system underneath. The version is fixed:
# the line after it needs a helper program at build time. See docs/box.md.
wasmi = { version = "=1.1.0", default-features = false }

# Seven crates are not fetched from the internet. Cargo is told to use the
# copies kept in vendor/ instead, which need no helper program at build time.
# See vendor/README.md.
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }
heapless = { path = "vendor/heapless" }
rustls = { path = "vendor/rustls" }
rustls-webpki = { path = "vendor/rustls-webpki" }
num-traits = { path = "vendor/num-traits" }
wasmparser = { path = "vendor/wasmparser" }
libm = { path = "vendor/libm" }
