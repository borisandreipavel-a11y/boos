# The boot tests. GitHub boots the kernel in QEMU on one of its own Windows computers and runs tests of
# test-tools/ there, for every pull request into master. For now it runs the whole set once, every suite and
# every break on purpose (run_tests.py all), to see how long each job takes on GitHub's computer and how much of
# its disk the tests use. See docs/testing.md, "Boot tests on GitHub".
#
# QEMU comes from the installer for 64-bit Windows that qemu.org names (qemu.weilnetz.de), version 11.1.0. The
# installer is refused unless its SHA-512 is the one written below, which is the one the site gives beside it.
# The UEFI firmware the tests start is the one that comes in that installer. The tests use no secret: every
# name, key and password they type is made up, and the kernel talks only to the stand-in for the provider on
# the same computer.

name: Boot tests

on:
  pull_request:
    branches: [master]

# The tests only read the repository.
permissions:
  contents: read

# A newer push to the same pull request stops the run for the older one.
concurrency:
  group: boot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    runs-on: windows-latest
    # About twice what the whole set is expected to take here.
    timeout-minutes: 210
    env:
      QEMU_INSTALLER: qemu-w64-setup-20260811.exe
      QEMU_SHA512: 5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543
      # Where the installer puts QEMU, and the firmware file it brings; test-tools/places.py reads both.
      QEMU_DIR: C:\Program Files\qemu
      BOOS_FIRMWARE: C:\Program Files\qemu\share\edk2-x86_64-code.fd
    steps:
      # The whole history: a test of the apps kept on the disk builds the kernel of an older commit from it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitHub keeps the installer between runs, so that it is not downloaded every time.
      - name: Take the QEMU installer kept by an earlier run
        id: kept
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\qemu-installer
          key: qemu-installer-${{ env.QEMU_INSTALLER }}

      - name: Download the QEMU installer
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\qemu-installer" | Out-Null
          Invoke-WebRequest -Uri "https://qemu.weilnetz.de/w64/2026/$env:QEMU_INSTALLER" -OutFile "$env:RUNNER_TEMP\qemu-installer\$env:QEMU_INSTALLER"

      # Every time, also when it was kept: an installer that differs by a single byte is refused and never run.
      - name: See that the installer is the one meant
        run: |
          $hash = (Get-FileHash -Algorithm SHA512 -LiteralPath "$env:RUNNER_TEMP\qemu-installer\$env:QEMU_INSTALLER").Hash.ToLower()
          Write-Output $hash
          if ($hash -cne $env:QEMU_SHA512) { exit 1 }

      - name: Keep the installer for later runs
        if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\qemu-installer
          key: qemu-installer-${{ env.QEMU_INSTALLER }}

      # /S: the installer asks nothing. It puts QEMU in C:\Program Files\qemu.
      - name: Install QEMU
        run: |
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP\qemu-installer\$env:QEMU_INSTALLER" -ArgumentList "/S" -Wait -PassThru
          Write-Output "The installer ended with $($installer.ExitCode)"
          if ($installer.ExitCode -ne 0) { exit 1 }

      - name: See that QEMU 11.1.0 and its firmware are there
        run: |
          $version = & "$env:QEMU_DIR\qemu-system-x86_64.exe" --version
          Write-Output $version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ($version -match "version 11\.1\.0")) { exit 1 }
          if (-not (Test-Path -LiteralPath $env:BOOS_FIRMWARE)) { exit 1 }
          Write-Output ("Firmware SHA-256: " + (Get-FileHash -Algorithm SHA256 -LiteralPath $env:BOOS_FIRMWARE).Hash)

      # The same Rust as the build check (build.yml), with the two targets the project needs.
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --target x86_64-unknown-uefi --target wasm32-unknown-unknown

      - name: Use Rust 1.100.0
        run: rustup default 1.100.0

      - name: See that Rust 1.100.0 is the one in use
        run: |
          $version = rustc --version
          Write-Output $version
          if ($version -notlike "rustc 1.100.0 *") { exit 1 }

      - name: Build the interpreter and the kernel
        run: python test-tools/build_all.py

      - name: How much disk is free before the tests
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } | ForEach-Object {
            "{0}: {1:N1} GB free of {2:N1} GB" -f $_.Name, ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB)
          }

      # Through the same runner as on any other computer (test-tools/run_tests.py), with two test machines side by
      # side. What the tests make (disk files, pictures, logs, copies of the project) goes to the runner's
      # temporary folder.
      - name: Boot the kernel and run every test
        env:
          BOOS_TEST_WORK: ${{ runner.temp }}\boos-tests
        run: python test-tools/run_tests.py all --workers 2

      # Also after a run that did not pass: what the tests and the builds left on the disk.
      - name: How much disk the tests used
        if: always()
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } | ForEach-Object {
            "{0}: {1:N1} GB free of {2:N1} GB" -f $_.Name, ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB)
          }
          foreach ($folder in "$env:RUNNER_TEMP\boos-tests", "$env:GITHUB_WORKSPACE\target", "$env:GITHUB_WORKSPACE\interpreter\target") {
            if (Test-Path -LiteralPath $folder) {
              $bytes = (Get-ChildItem -LiteralPath $folder -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
              "{0}: {1:N2} GB" -f $folder, ($bytes / 1GB)
            }
          }

      # When the tests failed or ran out of time: their logs, the kernel's lines and the pictures that were not as
      # meant, to look at afterwards. Anyone signed in to GitHub can download them, for 90 days; every name and key
      # in them is made up.
      - name: Keep the logs of a run that did not pass
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: boot-tests-logs
          path: |
            ${{ runner.temp }}\boos-tests\run-tests
            ${{ runner.temp }}\boos-tests\w*\runs
            !${{ runner.temp }}\boos-tests\**\*.img
            !${{ runner.temp }}\boos-tests\**\*.ppm
            !${{ runner.temp }}\boos-tests\**\*.efi
          if-no-files-found: ignore
