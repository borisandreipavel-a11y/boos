# A release of the boot disk. By hand only, with "Run workflow", from master: GitHub builds the kernel and the boot
# disk from the code of master's commit, checks them, and makes a DRAFT release with the files. A draft is seen only
# by those who may push to the repository; publishing it stays a person's step. The version is the one in
# Cargo.toml, and the release is marked as a pre-release, an early test version.
#
# On a pull request that changes this file, the shared steps or release/, the same files are made and checked as a
# dry run: nothing is uploaded, and that run may only read the repository. See docs/release.md.

name: Release

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/release.yml
      - .github/actions/release-files/**
      - release/**

# Only read, unless a job says otherwise: only the draft job may write, and only to make the draft.
permissions:
  contents: read

# One release run at a time for master; a newer push to a pull request stops the dry run for the older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to make the draft release
      actions: read     # to read the boot tests' result for the commit
    steps:
      - name: Only from master
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            Write-Output "A release is made only from master, not from $env:GITHUB_REF."
            exit 1
          }

      - uses: actions/checkout@v7

      # The whole set must have passed on this very commit, in the boot tests' run after it landed on master. When
      # changes landed close together, master's waiting runs are replaced by the newest, so some commits have no run.
      - name: See that the whole set passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow boot-tests.yml --commit $env:GITHUB_SHA --event push --json status,conclusion,databaseId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $passed = @($runs | Where-Object { $_.status -eq "completed" -and $_.conclusion -eq "success" })
          if ($passed.Count -eq 0) {
            Write-Output "The boot tests have not passed on $env:GITHUB_SHA (runs found: $(@($runs).Count)). A release waits for a commit on which they did."
            exit 1
          }
          Write-Output "The boot tests passed on $env:GITHUB_SHA (run $($passed[0].databaseId))."

      # Drafts are in the listing too. An earlier draft of this version is never replaced by the workflow: a person
      # deletes it first, on GitHub.
      - name: See that no release or draft has this version yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])"
          Write-Output "Version $version"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $same = @($releases | Where-Object { $_.tagName -eq "v$version" })
          if ($same.Count -gt 0) {
            if ($same[0].isDraft) { Write-Output "A draft v$version is there already: delete it first." } else { Write-Output "A release v$version is there already." }
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Make the release's files
        uses: ./.github/actions/release-files
        with:
          out: ${{ runner.temp }}\release

      # Only a draft, a pre-release: nothing is public until a person publishes it.
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}\release
        run: |
          gh release create "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --draft --prerelease --target $env:GITHUB_SHA --title "boos $env:VERSION (early test)" --notes-file "$env:OUT\release-notes.md" "$env:OUT\boos-$env:VERSION.zip" "$env:OUT\SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Whether making a draft already made its tag: GitHub's documentation does not say.
      - name: Say whether the tag is there yet
        run: |
          $tag = git ls-remote --tags origin "refs/tags/v$env:VERSION"
          if ($tag) { Write-Output "The tag v$env:VERSION is there already: $tag" } else { Write-Output "The tag v$env:VERSION is not there yet." }

  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Make the release's files
        uses: ./.github/actions/release-files
        with:
          out: ${{ runner.temp }}\release

      # What a release would carry, to read in this log. Nothing leaves this computer.
      - name: Show what a release would carry
        env:
          OUT: ${{ runner.temp }}\release
        run: |
          Get-ChildItem -LiteralPath $env:OUT -File | ForEach-Object { "{0,-24} {1,10} bytes" -f $_.Name, $_.Length }
          Get-Content -LiteralPath "$env:OUT\SHA256SUMS.txt"
          Get-Content -LiteralPath "$env:OUT\release-notes.md" -TotalCount 12
